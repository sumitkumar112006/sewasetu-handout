{% extends "base.html" %}
{% block content %}
<h2>Edit Application Details</h2>
<p class="note">Editing Application No: <b>{{ app.application_no }}</b>. You can update your details below while your application is under review.</p>

<form method="post">
  <h3>Personal Details</h3>
  <label>Full Name of Applicant</label>
  <input type="text" name="applicant_name" value="{{ app.applicant_name }}" required>

  <label>Date of Birth (DD/MM/YYYY)</label>
  <input type="text" name="dob" value="{{ app.dob }}" placeholder="DD/MM/YYYY" required>

  <label>Gender</label>
  <select name="gender">
    <option value="">--Select--</option>
    <option {% if app.gender=='Male' %}selected{% endif %}>Male</option>
    <option {% if app.gender=='Female' %}selected{% endif %}>Female</option>
    <option {% if app.gender=='Other' %}selected{% endif %}>Other</option>
  </select>

  <label>Marital Status</label>
  <select name="marital_status">
    <option value="">--Select--</option>
    <option {% if app.marital_status=='Married' %}selected{% endif %}>Married</option>
    <option {% if app.marital_status=='Unmarried' %}selected{% endif %}>Unmarried</option>
    <option {% if app.marital_status=='Widowed' %}selected{% endif %}>Widowed</option>
  </select>

  <label>Husband's Name</label>
  <input type="text" name="husband_name" value="{{ app.husband_name }}">

  <label>Husband's Current Employer</label>
  <input type="text" name="husband_employer" value="{{ app.husband_employer }}">

  <h3>Address Details</h3>
  <label>Village / Town</label>
  <input type="text" name="village" value="{{ app.village }}" required>

  <label>Block</label>
  <select name="block" required>
    <option value="">--Select--</option>
    {% for b in blocks %}
    <option {% if app.block==b %}selected{% endif %}>{{ b }}</option>
    {% endfor %}
  </select>

  <h3>Bank Details</h3>
  <label>Bank Account Number</label>
  <input type="text" name="bank_account" value="{{ app.bank_account }}" required>

  <label>IFSC Code</label>
  <input type="text" name="ifsc" value="{{ app.ifsc }}" required>

  <p style="margin-top: 1.5rem;">
    <button class="btn" type="submit">Save Changes</button>
    <a href="{{ url_for('view_application', app_id=app.id) }}" class="btn-secondary" style="margin-left: 8px;">Cancel</a>
  </p>
</form>
{% endblock %}
